name: Sync rates into DA placeholders

# Keeps the DA placeholders sheet in sync with the live rates served by
# the dashboard API. Runs on a schedule and on repository_dispatch so the
# dashboard's own deploy workflow can trigger an immediate sync after a
# deploy that includes a rate change.
#
# Required GitHub secrets:
#   RATES_API_KEY  — Bearer token matching RATES_API_KEY on the dashboard
#   DA_TOKEN       — IMS access token for a DA user with write access to the repo.
#                    Extract from a da.live browser session (DevTools → Network →
#                    any admin.da.live request → Authorization header).
#                    Valid for ~24 h; refresh when the workflow starts failing with 401.

on:
  schedule:
    - cron: '0 * * * *'
  repository_dispatch:
    types: [rates-changed]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync rates to DA placeholders
        env:
          RATES_API_KEY: ${{ secrets.RATES_API_KEY }}
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
        run: node scripts/sync-rates.mjs
