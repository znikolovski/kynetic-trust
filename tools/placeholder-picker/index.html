<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder Picker</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --cyan: #00dbe9;
      --violet: #dfb7ff;
      --text: rgba(255, 255, 255, 0.9);
      --text-muted: rgba(255, 255, 255, 0.45);
      --border: rgba(255, 255, 255, 0.08);
      --glass: rgba(255, 255, 255, 0.03);
      --glass-hover: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Adobe Clean', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px 7px 28px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    input[type="search"]:focus { border-color: rgba(0, 219, 233, 0.4); }
    input[type="search"]::placeholder { color: var(--text-muted); }
    input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .list::-webkit-scrollbar { width: 3px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .token-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 7px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      margin-bottom: 2px;
      user-select: none;
    }

    .token-item:hover {
      background: var(--glass-hover);
      border-color: var(--border);
    }

    .token-item.copied {
      background: rgba(0, 219, 233, 0.06);
      border-color: rgba(0, 219, 233, 0.25);
    }

    .token-main {
      overflow: hidden;
    }

    .token-key {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      color: var(--cyan);
      font-weight: 600;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .token-value {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      margin-top: 1px;
    }

    .token-action {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: color 0.12s;
    }

    .token-item:hover .token-action { color: var(--cyan); }

    .token-item.copied .token-action {
      color: var(--cyan);
    }

    .inserted-label { display: none; }
    .insert-label { display: block; }
    .token-item.copied .inserted-label { display: block; }
    .token-item.copied .insert-label { display: none; }

    .state-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 16px;
      font-size: 12px;
      line-height: 1.6;
    }

    .state-msg strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Placeholders</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="4.5"/>
        <path d="m10 10 3.5 3.5" stroke-linecap="round"/>
      </svg>
      <input type="search" id="search" placeholder="Search tokens or values…" autocomplete="off" spellcheck="false">
    </div>
  </header>
  <div class="list" id="list" role="list" aria-label="Placeholder tokens">
    <div class="state-msg">Loading…</div>
  </div>

  <script type="module">
    function toClassName(name) {
      return name.toLowerCase()
        .replace(/[^0-9a-z]/gi, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    let allTokens = [];
    let daPort = null; // MessageChannel port from the DA library host

    // DA library handshake — the host posts { ready: true, project, ... } with a port.
    window.addEventListener('message', (e) => {
      if (e.data?.ready && e.ports?.length) {
        daPort = e.ports[0];
      }
    });

    function insertToken(token) {
      if (daPort) {
        daPort.postMessage({ action: 'sendText', data: token });
      } else {
        // Standalone fallback: copy to clipboard
        try {
          navigator.clipboard.writeText(token);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = token;
          ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
      }
    }

    function renderList(tokens) {
      const list = document.getElementById('list');
      const count = document.getElementById('count');

      count.textContent = tokens.length === allTokens.length
        ? `${tokens.length} tokens`
        : `${tokens.length} of ${allTokens.length}`;

      if (tokens.length === 0) {
        list.innerHTML = '<div class="state-msg"><strong>No results</strong>Try a different search term</div>';
        return;
      }

      list.innerHTML = '';
      const fragment = document.createDocumentFragment();

      tokens.forEach(({ rawKey, value, token }) => {
        const item = document.createElement('div');
        item.className = 'token-item';
        item.setAttribute('role', 'listitem');
        item.setAttribute('title', `Click to insert ${token}`);
        item.innerHTML = `
          <div class="token-main">
            <span class="token-key">${token}</span>
            <span class="token-value">${value || '–'}</span>
          </div>
          <span class="token-action" aria-hidden="true">
            <span class="insert-label">Insert</span>
            <span class="inserted-label">Inserted</span>
          </span>
        `;

        item.addEventListener('click', () => {
          insertToken(token);
          item.classList.add('copied');
          setTimeout(() => item.classList.remove('copied'), 1800);
        });

        fragment.appendChild(item);
      });

      list.appendChild(fragment);
    }

    async function load() {
      const list = document.getElementById('list');
      try {
        const base = window.location.origin;
        const res = await fetch(`${base}/placeholders.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();

        allTokens = data
          .filter((row) => row.Key)
          .map((row) => ({
            rawKey: row.Key,
            value: row.Value ?? '',
            token: `{{${toClassName(row.Key)}}}`,
          }));

        if (allTokens.length === 0) {
          list.innerHTML = '<div class="state-msg"><strong>No placeholders yet</strong>Run the sync action to populate the sheet</div>';
          return;
        }

        renderList(allTokens);
      } catch (e) {
        list.innerHTML = `<div class="state-msg"><strong>Could not load placeholders</strong>${e.message}</div>`;
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = q
        ? allTokens.filter((t) =>
            t.rawKey.toLowerCase().includes(q)
            || t.value.toLowerCase().includes(q)
            || t.token.includes(q),
          )
        : allTokens;
      renderList(filtered);
    });

    load();
  </script>
</body>
</html>
